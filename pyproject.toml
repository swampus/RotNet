[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotnet-experiment"
version = "0.1.0"
description = "Exploratory dense versus structured hidden transformation experiment"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "torchvision>=0.19,<1", "numpy>=1.26,<3", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["rotnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
